name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.100.0"

  clippy-test:
    name: clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - name: Install GPUI / Wayland build deps
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            gcc g++ clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libvulkan1 \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  build-store-bench:
    name: Build store benchmark
    runs-on: ubuntu-latest
    # A slow Ubuntu mirror alone has taken 20 minutes to install build deps.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - name: Install GPUI / Wayland build deps
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            gcc g++ clang cmake pkg-config \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev \
            libvulkan-dev libvulkan1 \
            libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Linux artifacts on main populates the release dependency cache.
          shared-key: artifacts
          save-if: 'false'
      - name: Build benchmark executable
        run: |
          output="$RUNNER_TEMP/fell-bench-build.jsonl"
          cargo bench --locked -p fell --features bench-store --bench fell-bench \
            --no-run --message-format=json-render-diagnostics > "$output"
          binary=$(jq -ers '
            [.[] | select(.reason == "compiler-artifact"
              and .target.name == "fell-bench" and .executable != null) | .executable]
            | if length == 1 then .[0] else error("expected one fell-bench executable") end
          ' "$output")
          install -Dm755 "$binary" "$RUNNER_TEMP/fell-store-bench/fell-bench"
      - uses: actions/upload-artifact@v4
        with:
          name: fell-store-bench
          path: ${{ runner.temp }}/fell-store-bench/fell-bench
          if-no-files-found: error
          retention-days: 7

  store-budgets:
    name: 100k-message store budgets
    needs: build-store-bench
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The suite itself takes under ten minutes; the rest absorbs apt and
    # model download stalls.
    timeout-minutes: 30
    steps:
      - name: Require the benchmark build
        if: ${{ needs.build-store-bench.result != 'success' }}
        run: |
          echo "The benchmark executable was not built."
          exit 1
      - uses: actions/checkout@v4
      - name: Install benchmark runtime libraries
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libwebkit2gtk-4.1-0 libfreetype6 libxkbcommon0
      - uses: actions/download-artifact@v4
        with:
          name: fell-store-bench
          path: ${{ runner.temp }}/fell-store-bench
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fell-bench-models
          key: fell-bench-minilm-${{ hashFiles('crates/fell-core/src/embed/model_files.rs') }}
      - name: Measure and enforce store budgets
        env:
          FELL_BENCH_BUDGETS: ${{ github.workspace }}/bench/budgets.toml
          FELL_BENCH_MODEL_DIR: ${{ runner.temp }}/fell-bench-models
          FELL_BENCH_INSTALL_MODEL: '1'
        run: |
          chmod +x "$RUNNER_TEMP/fell-store-bench/fell-bench"
          time "$RUNNER_TEMP/fell-store-bench/fell-bench"
