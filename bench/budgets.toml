# Two thresholds per metric. See README.md.
#
# Watch values are hosted Ubuntu reference measurements, rounded up. A row
# above its watch value plus 20% is marked Watch and annotated in CI, but it
# does not fail the job: hosted runner CPUs differ by more than 20%.
folder_page_p95_ms = 0.75
thread_open_p95_ms = 3.0
keyword_search_p95_ms = 25.0
semantic_residual_p95_ms = 75.0
semantic_graph_p95_ms = 60.0
rest_rss_mb = 18.0

# Fail limits are the product targets in docs/scope.md and README.md. Hosted
# runners measure 2.5x or more below them, so a failure is a real regression.
folder_page_max_ms = 5.0
thread_open_max_ms = 16.0
keyword_search_max_ms = 50.0
rss_max_mb = 250.0
# Twice the 150 ms product target: some CPUs take a slow MiniLM path that
# measured 172-179 ms end to end with no Fell change (#228, #237). Hybrid p95
# above 150 ms is still marked Watch.
hybrid_search_max_ms = 300.0
