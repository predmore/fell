# Ubuntu CI reference values rounded up for runner variance. See README.md
# for the measured baseline and product maxima. The gate adds 20% to each value.
folder_page_p95_ms = 0.75
thread_open_p95_ms = 3.0
# Reference p50 for 2,048 executions of SQLite SELECT 1 in memory.
thread_reference_sqlite_p50_ms = 0.10
keyword_search_p95_ms = 25.0
# Independent limits for non-graph work and the MiniLM graph.
# The benchmark also applies a fixed end-to-end ceiling for each CPU profile.
semantic_residual_p95_ms = 75.0
semantic_graph_p95_ms = 60.0
# x86_64 without AVX2. The gate adds 20% (198 ms).
semantic_graph_x86_fallback_p95_ms = 165.0
rest_rss_mb = 18.0
