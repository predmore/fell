    <h1 style="margin:0;font:30px Georgia">The early crossing</h1>
  </td></tr>
  <tr><td style="padding:22px 24px 26px">
    <div style="height:190px;background:#cbdedc"></div>
    <p style="margin:16px 0 0;font:16px/1.4 sans-serif">The first boat crosses the harbor as the sun reaches the lighthouse. On Sundays it also calls at West Pier, where a footpath continues along the shore to the old railway bridge.</p>
    <p style="margin:12px 0 0;font:16px/1.4 sans-serif">The harbor office posts the weekend timetable on Thursday.</p>
