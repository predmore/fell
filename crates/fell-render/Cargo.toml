[package]
name = "fell-render"
description = "Styled document shared by native HTML mail and later markdown compose"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-utils = ["dep:skrifa"]

[dependencies]
base64 = "0.22"
cssparser = "0.34"
ego-tree = "0.10"
html5ever = "0.29"
percent-encoding = "2.3"
pulldown-cmark = "0.13"
scraper = "0.22"
selectors = "0.26"
tendril = "0.4"
skrifa = { version = "0.44", optional = true }
url = "2.5"

[lints.rust]
unsafe_code = "forbid"
