[package]
name = "fell"
description = "Fell GPUI client for Proton Mail (Wayland)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
bench-store = ["fell-core/test-utils"]

[[bench]]
name = "fell-bench"
harness = false
test = false
required-features = ["bench-store"]

[dependencies]
fell-confirm.workspace = true
fell-core = { workspace = true, features = ["ui-confirm"] }
fell-render.workspace = true
fell-version.workspace = true
gpui.workspace = true
futures = "0.3"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
libc = "0.2"
notify = { version = "=8.2.2", default-features = false }
raw-window-handle = "0.6"
# HTTPS for `fell embeddings install` only. No webpki-roots (its CDLA license is
# not on the allow list): the system trust store, through rustls with ring,
# like the IMAP client in fell-core.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
smallvec = "1"
tempfile = "3"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
unicode-linebreak = "0.1"
unicode-segmentation = "1"
url = "2.5"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }

[dev-dependencies]
# Tests check the store starts loading search (`Store::testing_*`). Dev only.
fell-core = { workspace = true, features = ["ui-confirm", "test-utils"] }
gpui = { workspace = true, features = ["test-support"] }
# The shaper GPUI uses on Linux, to test line cuts on real shaping.
cosmic-text = "0.14"
rusqlite.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"
