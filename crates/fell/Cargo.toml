[package]
name = "fell"
description = "Fell GPUI client for Proton Mail (Wayland)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fell-confirm.workspace = true
fell-core.workspace = true
fell-render.workspace = true
gpui.workspace = true
futures = "0.3"
gtk = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
libc = "0.2"
notify = { version = "=8.2.2", default-features = false }
# HTTPS for `fell embeddings install` only. No webpki-roots (its CDLA license is
# not on the allow list): the system trust store, through rustls with ring,
# like the IMAP client in fell-core.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
smallvec = "1"
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
wry = { version = "0.57.2", default-features = false, features = ["os-webview"] }

[dev-dependencies]
rusqlite.workspace = true
sha2 = { version = "0.10.9", default-features = false }
