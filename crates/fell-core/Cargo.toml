[package]
name = "fell-core"
description = "UI-free Proton Mail engine: accounts, backends, sync, store, threading, search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# `UserSendConfirmation::from_interactive_ui`, for the GPUI app only. It is
# the only use of `fell-confirm`, so `fell-mcp` (which leaves it off) does
# not link that crate at all.
ui-confirm = ["dep:fell-confirm"]
# `Store::testing_index_embeddings`, `Store::testing_search_embedder` and
# `Store::testing_search_warm_asked`, for other crates' tests: the first two
# rewrite the vector index and swap the search ranker. Also requires explicit
# draft paths when testing from other crates. Enable only for tests and benches.
test-utils = ["dep:tempfile"]

[dependencies]
backtrace = "0.3"
base64 = "0.22"
fell-confirm = { workspace = true, optional = true }
fell-render.workspace = true
fell-version.workspace = true
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# Stored body parts (src/store/bodies.rs). Pure Rust DEFLATE, MIT OR Zlib OR
# Apache-2.0, already in the tree through `png`.
miniz_oxide = "0.8.9"
mail-parser = { version = "1.0.1", default-features = false, features = ["full_encoding"] }
rusqlite.workspace = true
serde_json.workspace = true
sha2 = { version = "0.10.9", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
saphyr = { version = "0.3.4", default-features = false }
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
tempfile = { version = "3", optional = true }
thiserror.workspace = true
time = { version = "0.3", features = ["formatting", "local-offset"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# Local embedding model (see src/embed/onnx.rs). Pure Rust, MIT OR Apache-2.0,
# no native runtime and no build-time download. `transformers` is off: the
# pinned MiniLM graph only uses standard ONNX ops.
tract-onnx = { version = "0.23.10", default-features = false }
# WordPiece tokenizer for that model (src/embed/wordpiece.rs).
unicode-normalization = "0.1.24"
unicode-properties = { version = "0.1.3", default-features = false, features = ["general-category"] }

[dev-dependencies]
# Tests mint send confirmations.
fell-confirm.workspace = true
# Builds a tiny ONNX graph in tests. Same major version tract-onnx uses.
prost = "0.14"
rcgen = "0.13"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
xattr = "0.2"

[target.'cfg(target_arch = "x86_64")'.dependencies]
inventory = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
async-io = "2"
futures-lite = "2"
# Use the MIT-licensed Secret Service client already used by GPUI.
oo7 = { version = "0.5.0", default-features = false, features = ["async-std", "native_crypto"] }
