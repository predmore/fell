[package]
name = "fell-core"
description = "UI-free Proton Mail engine: accounts, backends, sync, store, threading, search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fell-confirm.workspace = true
mail-parser = { version = "1.0.1", default-features = false, features = ["full_encoding"] }
rusqlite.workspace = true
serde_json.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
saphyr = { version = "0.3.4", default-features = false }
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
thiserror.workspace = true

[dev-dependencies]
rcgen = "0.13"

[lints.rust]
unsafe_code = "forbid"
