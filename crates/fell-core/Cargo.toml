[package]
name = "fell-core"
description = "UI-free Proton Mail engine: accounts, backends, sync, store, threading, search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fell-confirm.workspace = true
mail-parser = { version = "1.0.1", default-features = false, features = ["full_encoding"] }
rusqlite.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
thiserror.workspace = true

[lints.rust]
unsafe_code = "forbid"
