[package]
name = "fell-mcp"
description = "MCP server for Fell agents (search, read, triage, review drafts; no send)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fell-mcp"
path = "src/main.rs"

[dependencies]
fell-core.workspace = true
fell-version.workspace = true
libc = "0.2.191"
# `add` writes harness configs through directory descriptors (openat,
# renameat, flock, fchmod) without unsafe code. Already in the tree via fs4.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
# `add` edits Goose's YAML config; the same parser fell-core uses for drafts.
saphyr = { version = "0.3.4", default-features = false }
# Merged JSON configs keep the key order people wrote.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
# `add` merges into Codex's config.toml and keeps its comments and layout.
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
# Tests index and rank with a tiny test embedder (`Store::testing_*`). Dev
# only: `cargo build -p fell-mcp --release` does not enable `test-utils`.
fell-core = { workspace = true, features = ["test-utils"] }
